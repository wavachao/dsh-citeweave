name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global pnpm@11.25.0
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          DSH_TELEMETRY_DISABLED: '1'
      - run: node scripts/package.js
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build backend distributions
        run: |
          python -m pip install uv==0.11.17
          uv build --directory backend --out-dir ../dist/backend
      - name: Add backend distribution checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          with Path('dist/SHA256SUMS').open('a') as checksum:
              for artifact in sorted(Path('dist/backend').glob('*')):
                  if artifact.name.endswith(('.whl', '.tar.gz')):
                      checksum.write(f'{hashlib.sha256(artifact.read_bytes()).hexdigest()}  {artifact.name}\n')
          PY
      - name: Publish installation archive and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz dist/backend/*.whl dist/backend/*.tar.gz dist/SHA256SUMS --verify-tag --title "$GITHUB_REF_NAME" --notes-file dist/RELEASE_NOTES.md
