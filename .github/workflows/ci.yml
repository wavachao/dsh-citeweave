name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global pnpm@11.25.0
      - run: npm ci
      - run: npm run check
      - run: npm test
        env:
          DSH_TELEMETRY_DISABLED: '1'

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: python -m pip install uv==0.11.17
      - name: Install locked CPU test dependencies
        working-directory: backend
        run: uv sync --frozen --only-group ci
      - name: Lint backend source and tests
        working-directory: backend
        run: uv run --no-sync ruff check src scripts tests test_vllm.py test_queue.py test_model_runtime.py
      - name: Test complete backend without GPU or model downloads
        working-directory: backend
        run: uv run --no-sync pytest -q tests test_vllm.py test_queue.py test_model_runtime.py
        env:
          PYTHONPATH: src
          CITEWEAVE_BACKEND_SOURCE: ${{ github.workspace }}/backend
          CITEWEAVE_QUEUE: ''
          CITEWEAVE_MODEL_LIFECYCLE: ''
