name: Bug report
description: Report a reproducible problem with the plugin.
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Plugin version, Harness version, Node.js version, and operating system.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the prompt, relevant configuration, expected result, and actual result. Remove tokens and private data.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Include relevant error messages. Remove secrets and private source content.
