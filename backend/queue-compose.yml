name: dsh-citeweave

services:
  redis:
    image: redis@sha256:b51665e66f00759be7c3152ad5ac3c66fb2f619c13ef62dea7cc1f9914524635
    container_name: dsh-citeweave-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    environment:
      REDISCLI_AUTH: ${CITEWEAVE_REDIS_PASSWORD:?Set a Redis password}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${CITEWEAVE_REDIS_PASSWORD:?Set a Redis password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    container_name: dsh-citeweave-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: citeweave
      POSTGRES_USER: citeweave
      POSTGRES_PASSWORD: ${CITEWEAVE_POSTGRES_PASSWORD:?Set a PostgreSQL password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citeweave -d citeweave"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  redis-data:
  postgres-data:
