[project]
name = "citeweave"
version = "0.5.1"
description = "Self-hosted multimodal web search with interleaved images and traceable sources"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.7.1", "torchvision==0.22.1", "transformers>=4.57,<5", "accelerate>=1.2,<2",
  "peft>=0.14,<1", "huggingface-hub>=0.34,<1", "safetensors>=0.5", "numpy>=1.26,<3",
  "pillow>=11", "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "beautifulsoup4>=4.13",
  "python-dotenv>=1", "pyyaml>=6", "tiktoken>=0.9", "tqdm>=4.67", "scikit-learn>=1.6",
  "sentence-transformers>=4,<6", "imagehash>=4.3", "ddgs>=9", "pymongo>=4.10",
  "celery[redis,sqlalchemy]==5.6.3", "psycopg2-binary>=2.9,<3"
]
[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]
ci = ["pytest>=8", "ruff>=0.12", "numpy>=1.26,<3", "pillow>=11", "fastapi>=0.115", "httpx>=0.28", "beautifulsoup4>=4.13", "python-dotenv>=1", "pyyaml>=6", "openai==1.59.4", "celery[redis,sqlalchemy]==5.6.3", "psycopg2-binary>=2.9,<3"]
official = ["openai==1.59.4", "dashscope==1.20.14", "langchain-openai==0.3.0", "ragas==0.2.9", "datasets==3.2.0", "pyarrow==20.0.0", "requests>=2.32"]
[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/citeweave"]
[tool.ruff]
target-version = "py312"
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
